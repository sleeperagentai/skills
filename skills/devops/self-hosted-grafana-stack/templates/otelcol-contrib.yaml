# OTel Collector (contrib build) — single OTLP ingest, fans out to the stack.
# Services export here on :4317 (gRPC) or :4318 (HTTP). Collector forwards:
#   traces  -> Tempo  OTLP :4327 gRPC
#   logs    -> Loki   /otlp
#   metrics -> Prometheus remote-write
# Prometheus must be launched with --web.enable-remote-write-receiver.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    send_batch_size: 512
    timeout: 2s
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOY_ENV:-development}   # :-default REQUIRED; empty errors
        action: upsert

exporters:
  otlp/tempo:
    endpoint: localhost:4327   # Tempo internal OTLP (see tempo config)
    tls: { insecure: true }
    sending_queue: { enabled: true }

  otlphttp/loki:
    # Loki 3 native OTLP endpoint. The old `loki` exporter was removed from
    # contrib — do not try to re-add it.
    endpoint: http://localhost:3100/otlp
    tls: { insecure: true }

  prometheusremotewrite:
    endpoint: http://localhost:9090/api/v1/write
    tls: { insecure: true }

extensions:
  health_check: { endpoint: 0.0.0.0:13133 }

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, resource, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [attributes/scrub, resource, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheusremotewrite]
