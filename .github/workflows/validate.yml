name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catalog is up to date
        run: python3 -I scripts/build-catalog.py --check
      - name: Repo lint
        run: bash scripts/validate.sh
      - name: Skills are discoverable by the skills CLI
        run: |
          npx -y skills add ./ --list > /tmp/list.txt 2>&1 || true
          cat /tmp/list.txt | tail -5
          want=$(find skills -name SKILL.md | wc -l)
          echo "repo has $want skills"
